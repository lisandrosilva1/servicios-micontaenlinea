<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Asesoría Telefónica con C.P Diego Silva. Consulta fiscal de 30 minutos. $450 - Programable a tu conveniencia.">
    <meta name="keywords" content="asesoría fiscal, consulta contable, asesor fiscal online">
    <meta property="og:title" content="Asesoría Telefónica - MiContaEnLínea">
    <meta property="og:description" content="Consulta directa con C.P Diego Silva. 30 minutos. $450.">
    <title>Asesoría Telefónica Profesional | MiContaEnLínea</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #2c2c2c; background: #fafaf8; }
        nav { background: white; box-shadow: 0 2px 8px rgba(13, 90, 61, 0.1); position: sticky; top: 0; z-index: 100; }
        nav .container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; }
        nav .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
            color: #2c2c2c;
            transition: opacity 0.3s ease;
        }

        nav .logo:hover {
            opacity: 0.8;
        }

        nav .logo svg {
            width: 45px;
            height: 45px;
            flex-shrink: 0;
        }

        .logo-text .brand-main {
            color: #2c2c2c;
            font-weight: 700;
        }

        .logo-text .brand-accent {
            color: #D4AF37;
            font-weight: 700;
        }

        function setupFormValidation() {
            document.getElementById('client-name').addEventListener('input', validateFormFields);
            document.getElementById('client-phone').addEventListener('input', validateFormFields);
            document.getElementById('client-date').addEventListener('change', validateFormFields);
            document.getElementById('client-time').addEventListener('change', validateFormFields);
        }

        document.querySelectorAll('.faq-item').forEach(item => { item.addEventListener('click', function() { const ans = this.querySelector('.faq-answer'); ans.style.display = ans.style.display === 'block' ? 'none' : 'block'; }); });

        document.addEventListener('DOMContentLoaded', setupFormValidation);
        // Handle Payment Button - Mercado Pago Integration
        document.getElementById('payment-button').addEventListener('click', function() {
            if (!this.disabled) {
                // Store service data in sessionStorage for thank you page
                sessionStorage.setItem('serviceData', JSON.stringify({
                    service: SERVICE_CONFIG.name,
                    price: SERVICE_CONFIG.price,
                    uploadedFiles: Object.keys(SERVICE_CONFIG.uploadedFiles),
                    timestamp: new Date().toISOString()
                }));

                // Create Mercado Pago preference
                const preference = {
                    items: [
                        {
                            title: 'Asesoría Telefónica 30 Minutos',
                            description: 'Consulta directa con C.P Diego Silva Meneses - Profesional con 40 años de experiencia',
                            picture_url: 'https://via.placeholder.com/150',
                            category_id: 'services',
                            quantity: 1,
                            unit_price: 450
                        }
                    ],
                    payer: {
                        name: 'Cliente MiContaEnLínea',
                        email: 'cliente@micontaenlinea.mx'
                    },
                    back_urls: {
                        success: window.location.origin + '/gracias/asesoria-telefonica.html',
                        failure: window.location.href,
                        pending: window.location.origin + '/gracias/asesoria-telefonica.html'
                    },
                    external_reference: 'ASES-' + new Date().getTime(),
                    auto_return: 'approved'
                };

                // Send preference to Mercado Pago
                fetch('https://api.mercadopago.com/checkout/preferences', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer APP_USR-5989261956266905-072316-54872d394695455d7ac9833818cc7f09-3537857872'
                    },
                    body: JSON.stringify(preference)
                })
                .then(response => response.json())
                .then(data => {
                    if (data.init_point) {
                        // Redirect to Mercado Pago checkout
                        window.location.href = data.init_point;
                    } else {
                        console.error('Error creating preference:', data);
                        alert('Error al procesar el pago. Por favor intenta de nuevo.');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    // Fallback to thank you page for testing
                    window.location.href = '/gracias/asesoria-telefonica.html?service=asesoria&price=450';
                });
            }
        });
        setupFileInputs();
    </script>
</body>
</html>
